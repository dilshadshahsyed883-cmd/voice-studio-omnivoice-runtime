name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit-test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy soundfile
      - name: Compile source
        run: python -m compileall -q app scripts
      - name: Verify standalone verifier import path
        run: python scripts/verify_model.py --help
      - name: Verify Docker image has no embedded healthcheck
        run: |
          grep -qx 'HEALTHCHECK NONE' Dockerfile
          ! grep -q '^HEALTHCHECK --' Dockerfile
      - name: Run CPU-safe tests
        run: PYTHONPATH=. pytest -q tests
