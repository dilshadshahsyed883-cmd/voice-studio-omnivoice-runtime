name: build-ghcr-candidate

on:
  push:
    branches:
      - "build/omnivoice-runtime-v0.1.0"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for CUDA + embedded model build
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=candidate-
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          provenance: true
      - name: Write immutable build evidence
        run: |
          mkdir -p artifacts
          printf '%s\n' '${{ steps.build.outputs.digest }}' > artifacts/image-digest.txt
          printf '%s\n' '${{ github.sha }}' > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-build-evidence
          path: artifacts/
